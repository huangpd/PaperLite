# PostgreSQL（任务队列 + 监控面板数据）。用法见 docs/guide/postgres.md：
#   echo "PG_PASS=$(openssl rand -hex 24)" > .env && chmod 600 .env && docker compose up -d
# 各机器 config.toml：[pg] dsn = "postgresql://paperlite:<PG_PASS>@<本机 IP>:5432/paperlite"
services:
  postgres:
    image: postgres:16
    container_name: paperlite-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperlite
      POSTGRES_PASSWORD: ${PG_PASS:?请先在 .env 里设 PG_PASS}
      POSTGRES_DB: paperlite
    # 按 16GB 内存的机器配：shared_buffers ≈ 内存 1/4（2GB 起），effective_cache_size ≈ 1/2
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=2GB",
              "-c", "effective_cache_size=8GB", "-c", "maintenance_work_mem=512MB", "-c", "max_wal_size=4GB"]
    shm_size: 1g                      # Docker 默认 64MB，大查询会报 could not resize shared memory
    ports:
      - "5432:5432"                   # 只对内网开放：安全组 / 防火墙限制来源网段；也可写成 "<内网IP>:5432:5432" 只绑内网网卡
    volumes:
      - pg-data:/var/lib/postgresql/data
volumes:
  pg-data:
