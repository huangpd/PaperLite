[project]
name = "paperlite"
version = "0.2.3"
description = "High-volume PDF and web page downloader for bot-protected sites: real browsers, rotating proxies, resumable SQLite task queue."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "huangpd", email = "1655979823@qq.com" }]
keywords = ["pdf", "downloader", "cloudflare", "curl_cffi", "cookie-pool", "scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "cloakbrowser[geoip]==0.6.4",
    "curl-cffi>=0.15.0",
    "redis>=5.0",
    "certifi>=2024.2.2",
    "pika>=1.3",                  # 监控上报 / 面板（paperlite-monitor）；未启用 [monitor] 时不会被导入
]

[project.optional-dependencies]
monitor = []                  # 兼容旧安装命令 paperlite[monitor]；pika 已是默认依赖

[project.urls]
Homepage = "https://github.com/huangpd/PaperLite"
Repository = "https://github.com/huangpd/PaperLite"
Issues = "https://github.com/huangpd/PaperLite/issues"

[project.scripts]
paperlite = "paperlite.cli:main"
paperlite-monitor = "paperlite.monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlite"]

# sdist 只放这些：项目目录里的 config.toml（含代理密码）、data/、db/、pdfs/ 绝不能进包
[tool.hatch.build.targets.sdist]
only-include = ["src/paperlite", "tests", "deploy", "docs", "README.md", "README.zh-CN.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
