[project]
name = "paperlite"
version = "0.1.0"
description = "单站点大批量 PDF 下载：浏览器过盾 cookie 池（Redis）+ curl_cffi + SQLite 任务库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloakbrowser>=0.6.2",
    "curl-cffi>=0.15.0",
    "redis>=5.0",
    "certifi>=2024.2.2",
]

[project.scripts]
paperlite = "paperlite.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
